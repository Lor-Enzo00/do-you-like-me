<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Do You Like Me</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    background: pink;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    text-align: center;
    z-index: 2;
  }

  h1 {
    font-size: 40px;
    color: #b30059;
    margin-bottom: 30px;
  }

  .heart {
    color: red;
  }

  .buttons button {
    font-size: 20px;
    padding: 15px 40px;
    margin: 10px;
    border: none;
    cursor: pointer;
    color: white;
  }

  .yes {
    background: red;
  }

  .no {
    background: black;
  }

  /* falling hearts */
  .falling {
    position: absolute;
    top: -50px;
    font-size: 24px;
    animation: fall linear infinite;
    opacity: 0.8;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh);
    }
  }

  /* yes screen */
  .yes-screen {
    background: pink;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-size: 40px;
    color: #b30059;
  }

  /* no screen */
  .no-screen {
    background: black;
    color: white;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
  }

  /* confetti */
  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    background: red;
    animation: pop 2s linear infinite;
  }

  @keyframes pop {
    0% {
      transform: translateY(0) rotate(0);
      opacity: 1;
    }
    100% {
      transform: translateY(600px) rotate(360deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<div class="container" id="main">
  <h1>DO YOU LIKE ME <span class="heart">❤️</span> ?</h1>
  <div class="buttons">
    <button class="yes" onclick="yesClick()">YES</button>
    <button class="no" onclick="noClick()">NO</button>
  </div>
</div>

<script>
  // falling hearts
  function createFalling() {
    const el = document.createElement("div");
    el.className = "falling";
    el.innerHTML = Math.random() > 0.5 ? "❤️" : "🌸";
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(el);

    setTimeout(() => {
      el.remove();
    }, 6000);
  }

  setInterval(createFalling, 300);

  function yesClick() {
    document.body.innerHTML = `
      <div class="yes-screen">
        <div>❤️🎉 and me toooooo 🎉❤️</div>
      </div>
    `;
    confettiBoom();
  }

  function noClick() {
    document.body.innerHTML = `
      <div class="no-screen">
        <div>it's okay</div>
      </div>
    `;
  }

  function confettiBoom() {
    for (let i = 0; i < 80; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = Math.random() > 0.5 ? "red" : "pink";
      c.style.animationDuration = (1 + Math.random()) + "s";
      document.body.appendChild(c);

      setTimeout(() => c.remove(), 2000);
    }
  }
</script>

</body>
</html>
