<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Question</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 300px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .yes {
      background-color: #4CAF50;
      color: white;
    }
    .no {
      background-color: #f44336;
      color: white;
    }
  </style>
</head>
<body>

  <div class="box" id="content">
    <h2>Do you like me?</h2>
    <button class="yes" onclick="answerYes()">Yes</button>
    <button class="no" onclick="answerNo()">No</button>
  </div>

  <script>
    function answerYes() {
      document.getElementById("content").innerHTML = `
        <h2>😊</h2>
        <p>I'm happy to hear that!</p>
        <a href="https://example.com" target="_blank">
          Click here to chat 💬
        </a>
      `;
    }

    function answerNo() {
      document.getElementById("content").innerHTML = `
        <h2>🙂</h2>
        <p>It's okay. Thanks for being honest.</p>
      `;
    }
  </script>

</body>
</html>
